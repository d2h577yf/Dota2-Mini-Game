[project]
name = "dota2-mini-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wanghongyu", email = "wanghongyu1028@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pipewire-capture>=0.3.0",
]

[project.scripts]
dota2-mini-game = "dota2_mini_game:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
